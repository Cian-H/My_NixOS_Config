- Cloud & Files:
    - Nextcloud:
        icon: nextcloud.png
        href: https://nextcloud.bulba.space
        description: Cloud storage & productivity
        siteMonitor: https://nextcloud.bulba.space
        server: podman
        container: nextcloud
        widget:
          type: nextcloud
          url: https://nextcloud.bulba.space
          username: "{{HOMEPAGE_VAR_NEXTCLOUD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NEXTCLOUD_PASSWORD}}"
    - Nextcloud Office:
        icon: collabora-online.png
        href: https://collabora.bulba.space
        description: Document collaboration engine
        siteMonitor: https://collabora.bulba.space
        server: podman
        container: nextcloud-collabora
    - Vikunja:
        icon: vikunja.png
        href: https://vikunja.bulba.space
        description: Tasks & project management
        ping: http://vikunja:3456
        server: podman
        container: vikunja
        widget:
          type: vikunja
          url: http://vikunja:3456
          key: "{{HOMEPAGE_VAR_VIKUNJA_TOKEN}}"

- Services:
    - Gitea:
        icon: gitea.png
        href: https://gitea.bulba.space
        description: Self-hosted Git service
        ping: http://gitea:3000
        server: podman
        container: gitea
        widget:
          type: gitea
          url: http://gitea:3000
          key: "{{HOMEPAGE_VAR_GITEA_TOKEN}}"
    - FreshRSS:
        icon: freshrss.png
        href: https://freshrss.bulba.space
        description: RSS feed aggregator
        ping: http://freshrss:80
        server: podman
        container: freshrss
        widget:
          type: freshrss
          url: http://freshrss:80
          username: "{{HOMEPAGE_VAR_FRESHRSS_USERNAME}}"
          password: "{{HOMEPAGE_VAR_FRESHRSS_PASSWORD}}"
    - Blog:
        icon: hugo.png
        href: https://blog.bulba.space
        description: Personal Blog & Notes
        siteMonitor: https://blog.bulba.space

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.bulba.space
        description: Media streaming server
        ping: http://jellyfin:8096
        server: podman
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_APIKEY}}"
          enableBlocks: true

- Infrastructure:
    - Caddy:
        icon: caddy.png
        href: https://bulba.space
        description: Reverse proxy
        ping: http://caddy:80
        server: podman
        container: caddy
    - Cloudflared:
        icon: cloudflare.png
        href: https://dash.cloudflare.com
        description: Cloudflare Tunnel
        server: podman
        container: cloudflared
    - CV API:
        icon: mdi-api
        href: https://bulba.space/api
        description: CV data API
        server: podman
        container: cv-api
    - Homepage:
        icon: homepage.png
        href: https://home.bulba.space
        description: This dashboard
        server: podman
        container: homepage
